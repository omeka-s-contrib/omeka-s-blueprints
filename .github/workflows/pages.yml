name: Pages

# Builds the docs from the current commit and adds assets/schema/ of every
# tag under schema/<tag>/. The schema URLs (v0, v0.1.0, …) only change when
# a release is tagged, never with a push to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical==0.0.68
      - run: zensical build --clean --strict
      - name: Add the schema of every tag
        run: |
          for tag in $(git tag -l 'v*'); do
            dir="site/schema/$tag"
            mkdir -p "$dir"
            git archive "$tag" assets/schema | tar -x --strip-components=2 -C "$dir"
            # The sources use the floating channel as $id; each copy gets its own.
            find "$dir" -name '*.json' -exec sed -i -E "s#(/omeka-s-blueprints/schema/)v[0-9]+/#\1$tag/#" {} +
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
